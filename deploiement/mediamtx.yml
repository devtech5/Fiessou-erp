# Serveur vidéo du module Sécurité (MediaMTX).
#
# Il reçoit les flux publiés par les relais des sites (RTSPS, port 8322) et
# les sert aux navigateurs en WebRTC (WHEP, port 8889 derrière le domaine
# video.fiessou.cloud). Il ne décide de rien : chaque publication et chaque
# lecture sont soumises à Fiessou, sur /api/video/autorisation.
#
# Écrit pour MediaMTX 1.x. Les noms de clés changent parfois d'une version à
# l'autre : comparez avec la configuration de référence de la version
# déployée avant la mise en service.

logLevel: info

# --------------------------------------------------------------- autorisation
authMethod: http
authHTTPAddress: https://fiessou.cloud/api/video/autorisation
# Rien n'échappe à Fiessou, pas même l'API ou les métriques : il les refuse.
authHTTPExclude: []

api: no
metrics: no
pprof: no
playback: no

# ------------------------------------------------- publication par les relais
rtsp: yes
rtspTransports: [tcp]
# Chiffré seulement : le flux d'une caisse ne traverse pas internet en clair.
rtspEncryption: strict
rtspsAddress: :8322
serverKey: /certificats/privkey.pem
serverCert: /certificats/fullchain.pem

rtmp: no
hls: no
srt: no

# --------------------------------------------------- lecture par les navigateurs
webrtc: yes
webrtcAddress: :8889
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: :8189
webrtcAdditionalHosts: [video.fiessou.cloud]
webrtcAllowOrigin: https://fiessou.cloud

paths:
  # Les chemins sont « s/<site>/<caméra>/<sd|hd> » ; Fiessou vérifie le reste.
  all_others:
