# pnpm n'exécute plus les scripts de build des dépendances sans autorisation
# explicite. Un paquet laissé sans décision fait échouer `pnpm install`.
allowBuilds:
  # Requis par drizzle-kit pour les migrations.
  esbuild: true
  # Non utilisés : aucun traitement d'image ni résolveur natif côté serveur.
  sharp: false
  unrs-resolver: false
